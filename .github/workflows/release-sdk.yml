name: Release @opencircuit/sdk

on:
  push:
    branches:
      - main
    paths:
      - "packages/sdk/**"
      - ".github/workflows/release-sdk.yml"
      - ".github/workflows/reusable-release.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.repository == 'opencircuit-dev/opencircuit-dev'
    uses: ./.github/workflows/reusable-release.yml
    with:
      package-name: "sdk"
      package-path: "packages/sdk"
    secrets:
      SEMANTIC_RELEASE_GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}
      SEMANTIC_RELEASE_NPM_TOKEN: ${{ secrets.SEMANTIC_RELEASE_NPM_TOKEN }}

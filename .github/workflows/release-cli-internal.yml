name: Release Internal CLI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-cli-internal.yml"
      - "core/**"
      - "extensions/cli/**"
      - "packages/**"
      - "scripts/build-packages.js"
      - "scripts/check-cli-release-artifact.mjs"
      - "scripts/package-cli-internal.mjs"
      - "scripts/cisco-release-profile.mjs"
      - "scripts/cli-release-pack-report.mjs"
      - "scripts/publish-cli-internal-artifact.sh"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
  workflow_dispatch:
    inputs:
      internal_version:
        description: "Internal CLI version to package (for example, 1.0.1)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-internal-cli
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish internal CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Protected environment: required reviewers and the Cisco profile secret.
    environment: internal-release
    if: github.repository == 'opencircuit-dev/opencircuit-internal-dev' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0

      - name: Setup shared packages
        uses: ./.github/actions/setup-packages

      - name: Setup Core dependencies
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build Core
        working-directory: core
        run: npm run build

      - name: Set internal CLI version
        if: ${{ inputs.internal_version != '' }}
        working-directory: extensions/cli
        env:
          INTERNAL_VERSION: ${{ inputs.internal_version }}
        run: npm version "$INTERNAL_VERSION" --no-git-tag-version --allow-same-version

      - name: Install CLI dependencies
        working-directory: extensions/cli
        run: npm ci --include=optional --no-audit --no-fund

      - name: Check CLI dependency policy
        working-directory: extensions/cli
        run: |
          npm run check:install-scripts
          npm run check:dependency-policy

      - name: Build CLI
        working-directory: extensions/cli
        run: npm run build

      - name: Run CLI unit tests
        working-directory: extensions/cli
        run: npm test

      - name: Test release profile tooling
        run: node --test scripts/cisco-release-profile.test.mjs scripts/package-cli-internal.test.mjs

      - name: Check release package contents
        working-directory: extensions/cli
        run: npm run check:release-artifact

      - name: Package internal CLI artifact
        working-directory: extensions/cli
        env:
          OCIRCUIT_RELEASE_CISCO_PROFILE: ${{ secrets.OCIRCUIT_CISCO_PROFILE }}
          OCIRCUIT_RELEASE_PROFILE_ID: ${{ vars.OCIRCUIT_RELEASE_PROFILE_ID }}
        run: npm run release:internal-artifact -- --output-dir "$RUNNER_TEMP/internal-cli-release"

      - name: Checkout internal artifact repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: opencircuit-dev/opencircuit-internal
          ref: main
          path: internal-release-repo
          fetch-depth: 0
          token: ${{ secrets.INTERNAL_RELEASE_REPO_TOKEN }}

      - name: Publish artifact to internal repository
        run: |
          bash scripts/publish-cli-internal-artifact.sh \
            --source "$RUNNER_TEMP/internal-cli-release" \
            --dest "$GITHUB_WORKSPACE/internal-release-repo" \
            --push

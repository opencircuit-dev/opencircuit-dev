name: Stable Release

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: "Version for stable release (e.g., 1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # Required for OIDC

# One global group: every stable release pushes to the same public repository.
concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  stable-release:
    name: Stable Release
    runs-on: ubuntu-24.04
    environment: stable-release
    # Only run this workflow on the canonical repository.
    if: github.repository == 'opencircuit-dev/opencircuit-dev' && github.ref == 'refs/heads/main'
    env:
      STABLE_VERSION: ${{ inputs.stable_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: Setup packages
        uses: ./.github/actions/setup-packages

      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Verify release version and tag state
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const packageJson = JSON.parse(fs.readFileSync("extensions/cli/package.json", "utf8"));
          if (packageJson.version !== process.env.STABLE_VERSION) {
            throw new Error(`input version ${process.env.STABLE_VERSION} does not match source version ${packageJson.version}`);
          }
          if (!/^\d+\.\d+\.\d+$/.test(process.env.STABLE_VERSION)) {
            throw new Error(`stable version must be release semver: ${process.env.STABLE_VERSION}`);
          }
          NODE
          if git ls-remote --exit-code --tags origin "refs/tags/v${STABLE_VERSION}" >/dev/null 2>&1; then
            echo "::error::release tag v${STABLE_VERSION} already exists"
            exit 1
          fi

      - name: Install CLI dependencies
        working-directory: extensions/cli
        run: npm ci --include=optional

      - name: Check CLI dependency policy
        working-directory: extensions/cli
        run: |
          npm run check:install-scripts
          npm run check:dependency-policy

      - name: Build
        working-directory: extensions/cli
        run: npm run build

      - name: Run tests
        working-directory: extensions/cli
        run: npm test

      - name: Build and validate exact release artifact
        working-directory: extensions/cli
        env:
          RELEASE_TAG: v${{ inputs.stable_version }}
        run: |
          npm run release:artifact
          npm run check:release-artifact

      - name: Verify clean reviewed source
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::release checkout is dirty"
            git status --short
            exit 1
          fi
          git show --no-patch --format='source commit: %H%nsubject: %s' HEAD

      # Everything below the tag step is irreversible, so prove the public
      # repository is reachable and accepts this exact bundle first.
      - name: Require public repository credentials
        env:
          PUBLIC_RELEASE_REPO_TOKEN: ${{ secrets.PUBLIC_RELEASE_REPO_TOKEN }}
        run: |
          if [[ -z "$PUBLIC_RELEASE_REPO_TOKEN" ]]; then
            echo "::error::PUBLIC_RELEASE_REPO_TOKEN is not configured"
            exit 1
          fi

      - name: Checkout public release-artifacts repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: opencircuit-dev/opencircuit
          path: public-release-repo
          token: ${{ secrets.PUBLIC_RELEASE_REPO_TOKEN }}

      - name: Preflight public repository publication
        working-directory: public-release-repo
        run: |
          "$GITHUB_WORKSPACE/scripts/publish-release-artifacts.sh" \
            --source "$GITHUB_WORKSPACE" \
            --dest "$PWD" \
            --no-commit

      - name: Create and push source tag
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          git tag -a "v${STABLE_VERSION}" -m "Open Circuit CLI v${STABLE_VERSION}" HEAD
          git push origin "v${STABLE_VERSION}"

      - name: Setup Node.js for OIDC publish
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: extensions/cli
        run: |
          unset NODE_AUTH_TOKEN
          npm publish "$GITHUB_WORKSPACE/release-artifacts/v${STABLE_VERSION}/opencircuit-cli-${STABLE_VERSION}.tgz" --tag latest --provenance
          echo "Published version: ${STABLE_VERSION}"

      - name: Publish release artifacts to public repository
        working-directory: public-release-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          "$GITHUB_WORKSPACE/scripts/publish-release-artifacts.sh" \
            --source "$GITHUB_WORKSPACE" \
            --dest "$PWD" \
            --push

      - name: Create release on GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          gh release create "v${STABLE_VERSION}" \
            --title "CLI Release v${STABLE_VERSION}" \
            --notes "Release v${STABLE_VERSION} built and published from the reviewed main commit." \
            --latest

      - name: Publish Blueprints to Runloop
        env:
          RUNLOOP_API_KEY: ${{ secrets.RUNLOOP_API_KEY }}
        run: |
          publish_blueprint() {
            local name=$1
            local template=$2

            echo "Publishing blueprint '$name' to Runloop API for version ${{ inputs.stable_version }}"

            # Use blueprint configuration from template file
            cp ".github/workflows/$template" blueprint.json

            # Publish to Runloop API
            response=$(curl -X POST "https://api.runloop.ai/v1/blueprints" \
              -H "Authorization: Bearer $RUNLOOP_API_KEY" \
              -H "Content-Type: application/json" \
              -d @blueprint.json \
              -w "%{http_code}" \
              -s)

            http_code=$(echo "$response" | tail -c 4)
            response_body=$(echo "$response" | head -c -4)

            if [[ "$http_code" == "200" ]] || [[ "$http_code" == "201" ]]; then
              echo "✅ Successfully published blueprint '$name' to Runloop API"
              echo "Response: $response_body"

              blueprint_id=$(echo "$response_body" | jq -r '.id // empty')
              if [[ -n "$blueprint_id" ]]; then
                echo "Blueprint ID: $blueprint_id"
              fi
            else
              echo "❌ Failed to publish blueprint '$name' to Runloop API"
              echo "HTTP Code: $http_code"
              echo "Response: $response_body"
              exit 1
            fi
          }

          # Publish both oc and oc-staging blueprints
          publish_blueprint "oc" "runloop-blueprint-template.json"
          publish_blueprint "oc-staging" "runloop-blueprint-staging-template.json"

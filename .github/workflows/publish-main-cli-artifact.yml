name: Validate Main CLI Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-main-cli-artifact
  cancel-in-progress: false

jobs:
  validate-cli-artifact:
    name: Validate CLI bundle
    runs-on: ubuntu-24.04
    if: github.repository == 'opencircuit-dev/opencircuit-dev'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0

      - name: Setup packages
        uses: ./.github/actions/setup-packages

      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        working-directory: core
        run: npm run build

      - name: Install CLI dependencies
        working-directory: extensions/cli
        run: |
          npm ci --include=optional
          npm run check:install-scripts
          npm run check:dependency-policy

      - name: Build CLI
        working-directory: extensions/cli
        run: |
          npm run build
          npm run check:licenses

      - name: Test CLI
        working-directory: extensions/cli
        run: npm test

      - name: Build release artifact
        working-directory: extensions/cli
        run: npm run release:artifact

      - name: Validate release artifact
        working-directory: extensions/cli
        run: npm run check:release-artifact

      - name: Verify committed notices match the bundle
        run: |
          if ! git diff --quiet -- extensions/cli/THIRD_PARTY_NOTICES.txt; then
            echo "::error::THIRD_PARTY_NOTICES.txt is stale; run npm run generate:notices in extensions/cli and commit the result"
            git diff --stat -- extensions/cli/THIRD_PARTY_NOTICES.txt
            exit 1
          fi

      - name: Record non-release result
        run: echo "Main-branch validation does not publish a release; use stable-release.yml for tagged promotion."

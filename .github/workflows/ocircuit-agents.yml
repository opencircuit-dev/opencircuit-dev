name: Open Circuit Agents

on:
  workflow_call:
    inputs:
      agents-path:
        description: "Reviewed agent criteria directory"
        required: false
        default: ".ocircuit/agents"
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        description: "Provider credential used only by the fixed tool-free broker"
        required: true

permissions:
  contents: read

jobs:
  validate-caller:
    runs-on: ubuntu-latest
    steps:
      - name: Require a trusted default-branch push
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$CALLER_REPOSITORY" != "opencircuit-dev/opencircuit-dev" ] ||
            [ "$CALLER_EVENT" != "push" ] ||
            [ "$CALLER_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Only trusted default-branch pushes may request review."
            exit 1
          fi

  discover:
    needs: validate-caller
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed criteria
        id: discover
        env:
          AGENTS_PATH: ${{ inputs.agents-path }}
        run: |
          set -euo pipefail
          test "$AGENTS_PATH" = ".ocircuit/agents"
          MATRIX="$(node scripts/verify-agent-path.mjs --discover)"
          node -e 'if (JSON.parse(process.argv[1]).length !== 5) process.exit(1)' "$MATRIX"
          printf 'matrix=%s\n' "$MATRIX" >> "$GITHUB_OUTPUT"

  analyze:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
      - name: Prepare bounded review input without credentials
        run: |
          set -euo pipefail
          git --no-pager diff --no-ext-diff --no-textconv HEAD^ HEAD -- > "$RUNNER_TEMP/review.diff"
      - name: Tool-free review (no agent executable or repository tools)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_FILE: ${{ matrix.agent }}
          DIFF_FILE: ${{ runner.temp }}/review.diff
        run: node scripts/review-agent.mjs

  publish:
    if: always() && needs.validate-caller.result == 'success'
    needs: [validate-caller, discover, analyze]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Publish fixed status only, without checkout or provider credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CALLER_RESULT: ${{ needs.validate-caller.result }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        with:
          script: |
            const success = [process.env.CALLER_RESULT, process.env.DISCOVER_RESULT, process.env.ANALYZE_RESULT]
              .every(result => result === 'success');
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Open Circuit: tool-free review',
              head_sha: context.sha,
              status: 'completed',
              conclusion: success ? 'success' : 'failure',
              output: {
                title: success ? 'Review passed' : 'Review requires human attention',
                summary: 'Tool-free analysis only. No model output, credentials or repository tools are published or executed.',
              },
            });
            if (!success) core.setFailed('Tool-free review did not pass.');

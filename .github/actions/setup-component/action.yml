name: "Setup Component"
description: "Cache and install dependencies for a specific component"
inputs:
  component:
    description: "Component name (core or binary)"
    required: true
  include-packages:
    description: "Whether to include packages cache (default: true)"
    required: false
    default: "true"
  include-root:
    description: "Whether to include root cache (default: false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: ".nvmrc"
    - uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-cache-${{ inputs.component }}-v2-${{ hashFiles(format('{0}/package-lock.json', inputs.component)) }}

    - uses: actions/cache@v4
      if: inputs.include-packages == 'true'
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-packages-node-modules-${{ hashFiles('package-lock.json') }}

    - uses: actions/cache@v4
      if: inputs.include-root == 'true'
      id: root-cache
      with:
        path: node_modules
        key: ${{ runner.os }}-root-node-modules-v2-${{ hashFiles('package-lock.json') }}

    - name: Install root dependencies
      if: inputs.include-root == 'true' && steps.root-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - uses: actions/cache@v4
      id: component-cache
      with:
        path: ${{ format('{0}/node_modules', inputs.component) }}
        key: ${{ runner.os }}-${{ inputs.component }}-node-modules-v2-${{ hashFiles(format('{0}/package-lock.json', inputs.component)) }}

    - name: Install component dependencies
      if: steps.component-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd ${{ inputs.component }}
        npm ci

    - name: Check approved install scripts
      if: inputs.component == 'core'
      shell: bash
      run: |
        cd core
        npm run check:install-scripts

    - name: Check dependency policy
      if: inputs.component == 'core'
      shell: bash
      run: |
        cd core
        npm run check:dependency-policy

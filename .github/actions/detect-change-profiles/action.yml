name: Detect Change Profiles
description: Classify changed paths into the retained CLI/Core validation profile.
inputs:
  base-sha:
    description: Base revision to compare against.
    required: false
    default: ""
  head-sha:
    description: Head revision to compare.
    required: false
    default: ""
outputs:
  cli_core:
    description: Whether the CLI/Core profile is required.
    value: ${{ steps.classify.outputs.cli_core }}
runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail

        base_sha="${BASE_SHA:-}"
        head_sha="${HEAD_SHA:-$GITHUB_SHA}"
        if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
          base_sha="$(git rev-parse "$head_sha^" 2>/dev/null || true)"
        fi

        if [[ -n "$base_sha" ]]; then
          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
        else
          changed_files="$(git show --format= --name-only "$head_sha")"
        fi

        cli_core=false
        while IFS= read -r file; do
          [[ -z "$file" ]] && continue
          case "$file" in
            packages/sdk/**|.github/workflows/release-sdk.yml|core/**|packages/**|extensions/cli/**|binary/**|scripts/**|package.json|package-lock.json|.nvmrc|.node-version|.github/actions/**|*.lock|**/package-lock.json|.github/workflows/**)
              cli_core=true
              ;;
          esac
        done <<< "$changed_files"

        echo "cli_core=$cli_core" >> "$GITHUB_OUTPUT"
        echo "CLI/Core profile required: $cli_core"

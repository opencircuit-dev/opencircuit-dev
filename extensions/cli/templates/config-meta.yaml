name: Open Circuit Meta Muse
version: 1.0.0
schema: v1
# /model discovers chat models if this endpoint supports GET /models.
# This configured model remains available when model listing is unsupported.
models:
  - name: Meta Muse Spark
    provider: openai-compatible
    model: muse-spark-1.3
    apiBase: https://api.meta.ai/v1/
    apiKey: ${{ secrets.META_MODEL_API_KEY }}
    roles:
      - chat
